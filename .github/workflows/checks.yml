name: Check and release app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package static app
        run: tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf airport-time-space.tar.gz -C dist .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" airport-time-space.tar.gz --verify-tag --title "Airport Time / Space $GITHUB_REF_NAME" --generate-notes
